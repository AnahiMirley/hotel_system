<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">

    <div>
        <h2 class="fw-bold mb-1">Gestión de Servicios</h2>
        <p class="text-secondary mb-0">
            Administra los servicios adicionales que ofrece el hotel.
        </p>
    </div>

    <button class="btn btn-primary px-4 shadow-sm" onclick="abrirFormularioServicio()">
        <i class="bi bi-plus-lg me-2"></i>
        Nuevo Servicio
    </button>

</div>

<!-- Buscador -->

<div class="card border-0 shadow-sm rounded-4 mb-4">

    <div class="card-body p-4">

        <div class="input-group">

            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search"></i>
            </span>

            <input
                type="text"
                class="form-control form-control-lg border-start-0"
                id="buscar-servicio"
                placeholder="Buscar por nombre del servicio...">

            <button
                class="btn btn-primary px-4"
                type="button"
                onclick="buscarServicios()">

                Buscar

            </button>

        </div>

    </div>

</div>

<!-- Tabla -->

<div class="card border-0 shadow-sm rounded-4">

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-hover table-striped align-middle mb-0">

                <thead class="table-primary">

                    <tr>

                        <th class="ps-4">Nombre</th>

                        <th>Descripción</th>

                        <th>Precio</th>

                        <th class="text-end pe-4">Acciones</th>

                    </tr>

                </thead>

                <tbody id="tabla-servicio"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- Modal -->

<div class="modal fade" id="modal-servicio" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content border-0 rounded-4 shadow">

            <form id="form-servicio" class="needs-validation" novalidate>

                <div class="modal-header">

                    <h5 class="modal-title fw-semibold" id="titulo-modal-servicio">
                        Nuevo Servicio
                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body p-4">

                    <input type="hidden" id="id_servicio">

                    <div class="mb-4">

                        <label class="form-label fw-semibold" for="nombre">
                            Nombre del Servicio
                        </label>

                        <input
                            type="text"
                            class="form-control form-control-lg"
                            id="nombre"
                            maxlength="80"
                            minlength="2"
                            required>

                        <div class="invalid-feedback">
                            El nombre es obligatorio (mínimo 2 caracteres).
                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold" for="descripcion">
                            Descripción
                        </label>

                        <textarea
                            class="form-control"
                            id="descripcion"
                            rows="4"
                            maxlength="255"
                            placeholder="Ingrese una breve descripción del servicio..."></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold" for="precio">
                            Precio ($)
                        </label>

                        <input
                            type="number"
                            class="form-control form-control-lg"
                            id="precio"
                            min="0"
                            step="0.01"
                            required>

                        <div class="invalid-feedback">
                            Ingrese un precio válido.
                        </div>

                    </div>

                </div>

                <div class="modal-footer py-3">

                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary px-4">

                        <i class="bi bi-check-circle me-2"></i>

                        Guardar Servicio

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

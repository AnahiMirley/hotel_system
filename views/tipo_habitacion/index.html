<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">

    <div>
        <h2 class="fw-bold mb-1">Gestión de Tipos de Habitación</h2>
        <p class="text-secondary mb-0">
            Administra las categorías de habitaciones y sus tarifas base.
        </p>
    </div>

    <button class="btn btn-primary px-4 shadow-sm" onclick="abrirFormularioTipo()">
        <i class="bi bi-plus-lg me-2"></i>
        Nuevo Tipo
    </button>

</div>

<!-- Buscador -->

<div class="card border-0 shadow-sm rounded-4 mb-4">

    <div class="card-body p-4">

        <div class="input-group">

            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search"></i>
            </span>

            <input
                type="text"
                class="form-control form-control-lg border-start-0"
                id="buscar-tipo"
                placeholder="Buscar por nombre del tipo...">

            <button
                class="btn btn-primary px-4"
                type="button"
                onclick="buscarTipos()">

                Buscar

            </button>

        </div>

    </div>

</div>

<!-- Tabla -->

<div class="card border-0 shadow-sm rounded-4">

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-hover table-striped align-middle mb-0">

                <thead class="table-primary">

                    <tr>

                        <th class="ps-4" width="60">#</th>

                        <th>Nombre</th>

                        <th>Descripción</th>

                        <th class="text-center">Capacidad</th>

                        <th class="text-end">Precio Base</th>

                        <th class="text-end pe-4">Acciones</th>

                    </tr>

                </thead>

                <tbody id="tabla-tipo"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- Modal -->

<div class="modal fade" id="modal-tipo" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content border-0 rounded-4 shadow">

            <form id="form-tipo" class="needs-validation" novalidate>

                <div class="modal-header bg-primary text-white">

                    <h5 class="modal-title fw-semibold" id="titulo-modal-tipo">
                        Nuevo Tipo de Habitación
                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body p-4">

                    <input type="hidden" id="id_tipo_habitacion">

                    <div class="mb-4">

                        <label class="form-label fw-semibold" for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control form-control-lg"
                            id="nombre"
                            maxlength="50"
                            minlength="2"
                            required>

                        <div class="invalid-feedback">
                            El nombre es obligatorio (mínimo 2 caracteres).
                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold" for="descripcion">
                            Descripción
                        </label>

                        <textarea
                            class="form-control"
                            id="descripcion"
                            rows="4"
                            maxlength="255"
                            placeholder="Describe las características de este tipo de habitación..."></textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold" for="capacidad">
                                Capacidad (Personas)
                            </label>

                            <input
                                type="number"
                                class="form-control form-control-lg"
                                id="capacidad"
                                min="1"
                                max="20"
                                required>

                            <div class="invalid-feedback">
                                Ingrese una capacidad válida.
                            </div>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold" for="precio_base">
                                Precio Base ($/Noche)
                            </label>

                            <input
                                type="number"
                                class="form-control form-control-lg"
                                id="precio_base"
                                min="0"
                                step="0.01"
                                required>

                            <div class="invalid-feedback">
                                Ingrese un precio válido.
                            </div>

                        </div>

                    </div>

                </div>

                <div class="modal-footer py-3">

                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary px-4">

                        <i class="bi bi-check-circle me-2"></i>

                        Guardar Tipo

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

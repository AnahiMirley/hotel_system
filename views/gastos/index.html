<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">

    <div>
        <h2 class="fw-bold mb-1">Gestión de Gastos</h2>
        <p class="text-secondary mb-0">
            Administra los gastos generados por las reservas del hotel.
        </p>
    </div>

    <button class="btn btn-primary px-4 shadow-sm" onclick="abrirFormularioGasto()">
        <i class="bi bi-plus-lg me-2"></i>
        Nuevo Gasto
    </button>

</div>

<!-- Buscador -->

<div class="card border-0 shadow-sm rounded-4 mb-4">

    <div class="card-body p-4">

        <div class="input-group">

            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search"></i>
            </span>

            <input
                type="text"
                class="form-control form-control-lg border-start-0"
                id="buscar-gasto"
                placeholder="Buscar por concepto o cliente...">

            <button
                class="btn btn-primary px-4"
                type="button"
                onclick="buscarGastos()">
                Buscar
            </button>

        </div>

    </div>

</div>

<!-- Tabla -->

<div class="card border-0 shadow-sm rounded-4">

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-hover table-striped align-middle mb-0">

                <thead class="table-primary">

                    <tr>

                        <th class="ps-4">Reserva</th>
                        <th>Cliente</th>
                        <th>Concepto</th>
                        <th>Monto</th>
                        <th>Fecha</th>
                        <th class="text-end pe-4">Acciones</th>

                    </tr>

                </thead>

                <tbody id="tabla-gasto"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- Modal -->

<div class="modal fade" id="modal-gasto" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content border-0 rounded-4 shadow">

            <form id="form-gasto" class="needs-validation" novalidate>

                <div class="modal-header bg-primary text-white">

                    <h5 class="modal-title fw-semibold" id="titulo-modal-gasto">
                        Nuevo Gasto
                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body p-4">

                    <input type="hidden" id="id_gasto">

                    <div class="mb-4">

                        <label class="form-label fw-semibold" for="id_reserva">
                            Reserva
                        </label>

                        <select
                            class="form-select form-select-lg"
                            id="id_reserva"
                            required>
                        </select>

                        <div class="invalid-feedback">
                            Seleccione una reserva.
                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold" for="concepto">
                            Concepto
                        </label>

                        <input
                            type="text"
                            class="form-control form-control-lg"
                            id="concepto"
                            maxlength="120"
                            minlength="3"
                            required>

                        <div class="invalid-feedback">
                            El concepto es obligatorio (mínimo 3 caracteres).
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold" for="monto">
                                Monto ($)
                            </label>

                            <input
                                type="number"
                                class="form-control form-control-lg"
                                id="monto"
                                min="0"
                                step="0.01"
                                required>

                            <div class="invalid-feedback">
                                Ingrese un monto válido.
                            </div>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold" for="fecha">
                                Fecha
                            </label>

                            <input
                                type="date"
                                class="form-control form-control-lg"
                                id="fecha"
                                required>

                            <div class="invalid-feedback">
                                Seleccione una fecha.
                            </div>

                        </div>

                    </div>

                </div>

                <div class="modal-footer py-3">

                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary px-4">

                        <i class="bi bi-check-circle me-2"></i>

                        Guardar Gasto

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
